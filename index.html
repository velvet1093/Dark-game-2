<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ashen Vow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Jersey+15&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="overlay"></div>
  <div id="topbar">
    <button data-act="journal" class="tb touch-only" type="button" aria-label="Quests">☰</button>
    <button id="fs" class="tb" type="button" title="Full screen" aria-label="Full screen" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="enter" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="exit" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
    </button>
    <button data-act="pause" class="tb touch-only" type="button" aria-label="Pause">II</button>
  </div>
  <div id="touch">
    <button data-act="flask" class="hud-tap" id="t-flask" type="button" aria-label="Drink flask"></button>
    <button data-act="cure" class="hud-tap" id="t-cure" type="button" aria-label="Drink lily tincture"></button>
    <button data-act="swap" class="hud-tap" id="t-swap" type="button" aria-label="Change weapon"></button>
    <div class="move"><button data-act="left" type="button" aria-label="Move left">◀</button><button data-act="right" type="button" aria-label="Move right">▶</button></div>
    <button data-act="use" id="t-use" type="button">Use</button>
    <button data-act="down" id="t-down" type="button" aria-label="Drop through the ledge">Drop</button>
    <button data-act="jump" id="t-jump" type="button">Jump</button>
    <button data-act="block" id="t-block" type="button">Block</button>
    <button data-act="roll" id="t-roll" type="button">Roll</button>
    <button data-act="heavy" id="t-heavy" type="button">Heavy</button>
    <button data-act="attack" id="t-attack" type="button">Slash</button>
  </div>
</div>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/interiors.js"></script>
<script src="js/areas.js"></script>
<script src="js/traps.js"></script>
<script src="js/entities.js"></script>
<script src="js/chibi.js"></script>
<script src="js/sprites.js"></script>
<script src="js/npc.js"></script>
<script src="js/quests.js"></script>
<script src="js/mountain.js"></script>
<script src="js/swamp.js"></script>
<script src="js/fairy.js"></script>
<script src="js/story.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
